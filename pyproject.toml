[project]
name = "eyelab"
version = "0.4.2"
description = "Multi-modal annotation tool for eye imaging data"
authors = [{ name = "Olivier Morelle", email = "oli4morelle@gmail.com" }]
requires-python = ">=3.8,<3.10"
license = "MIT"
dependencies = [
    "qimage2ndarray==1.9.0",
    "requests>=2.27.1,<3",
    "PySide6==6.1.3",
    "numpy>=1.22",
    "eyepy>=0.12.1",
]

[dependency-groups]
dev = [
    "pyinstaller~=4.8",
    "pytest>=6.2.5,<7",
    "pytest-cov>=3.0.0,<4",
    "pre-commit>=2.17.0,<3",
    "commitizen>=2.20.4,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.semantic_release]
major_on_zero = false
version_variable = ['eyelab/__init__.py:__version__']
version_toml = "pyproject.toml:project.version"
version_pattern = ["CITATION.cff:v(\\d+\\.\\d+\\.\\d+)", "README.md:v(\\d+\\.\\d+\\.\\d+)"]
upload_to_pypi = true
upload_to_release = true
build_command = "uv build"
branch = "main"
